<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Subasta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/public/css/style.css">
</head>

<body>
    <div class="page-container"></div>
    <nav aria-label="Page navigation">
        <ul class="pagination justify-content-center"></ul>
    </nav>

    <template id="vehicle-template">
        <div class="container my-5 page">
            <div class="card auction-card mx-auto">
                <div class="row g-0">
                    <!-- Carrusel -->
                    <div class="col-md-6 position-relative">
                        <div id="carousel-{{id}}" class="carousel slide" data-bs-ride="carousel">
                            <div class="carousel-inner">
                                {{#images}}
                                <div class="carousel-item {{#active}}active{{/active}}">
                                    <img src="{{src}}" class="d-block w-100 car-img" alt="{{alt}}">
                                </div>
                                {{/images}}
                            </div>
                            <button class="carousel-control-prev" type="button" data-bs-target="#carousel-{{id}}"
                                data-bs-slide="prev">
                                <span class="carousel-control-prev-icon"></span>
                            </button>
                            <button class="carousel-control-next" type="button" data-bs-target="#carousel-{{id}}"
                                data-bs-slide="next">
                                <span class="carousel-control-next-icon"></span>
                            </button>
                        </div>

                        <!-- Sección Siniestro -->
                        <div class="row g-2 mt-3 px-3">
                            <div class="col-12">
                                <h3 class="card-title mb-1">Siniestro</h3>
                                <p class="text-muted mt-1">{{siniestroDescription}}</p>
                            </div>
                        </div>
                    </div>

                    <!-- Detalles -->
                    <div class="col-md-6">
                        <div class="card-body p-4">
                            <!-- Encabezado -->
                            <div class="row align-items-center mb-4">
                                <div class="col-6 col-md-7">
                                    <h3 class="card-title mb-1">{{title}}</h3>
                                    <p class="text-muted mt-1">{{year}} • {{km}}</p>
                                </div>
                                <div class="col-6 col-md-5 text-end">
                                    <div class="d-inline-block">
                                        <small class="text-muted">TIEMPO RESTANTE</small>
                                        <h5 class="mb-0 time-display" data-vehicle-id="{{id}}">
                                            <span class="hours">12</span>:
                                            <span class="minutes">00</span>:
                                            <span class="seconds">00</span>
                                        </h5>
                                    </div>
                                </div>
                            </div>

                            <!-- Bolsa de reparación -->
                            <div class="bid-section mb-4">
                                <div class="d-flex justify-content-between align-items-center mb-3">
                                    <div>
                                        <small class="text-muted d-block">BOLSA DE REPARACION</small>
                                        <h4 class="mb-0">{{repairBag}}</h4>
                                    </div>
                                    <!-- Espacio para mostrar la oferta -->
                                    <div class="bid-display d-none" data-vehicle-id="{{id}}">
                                        <small class="text-muted d-block">TU OFERTA</small>
                                        <h4 class="mb-0 text-success"></h4>
                                    </div>
                                </div>
                            </div>
                            <!-- Apartado de ingresa tu oferta -->
                            <div class="col-12 col-md-5 text-end mb-3">
                                <div class="d-flex flex-column align-items-end gap-1"s>
                                    <small class="text-muted">INGRESA TU OFERTA</small>
                                    <input type="number" class="form-control bid-input" placeholder="$ MXN"
                                        data-vehicle-id="{{id}}" style="width: 120px;">
                                </div>
                            </div>

                            <!-- Botón -->
                            <div class="d-grid gap-2">
                                <button class="btn btn-bid btn-lg">HACER OFERTA</button>
                            </div>

                            <!-- Ubicación y vendedor -->
                            <div class="row mt-4">
                                <div class="col-6">
                                    <small class="text-muted d-block">Ubicación</small>
                                    <span class="fw-bold">{{location}}</span>
                                </div>
                                <div class="col-6">
                                    <small class="text-muted d-block">Vendedor</small>
                                    <span class="fw-bold">{{seller}}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <script src="https://cdn.jsdelivr.net/npm/mustache@4.2.0/mustache.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

    <script src="/public/js/informacion_vehiculos.js"></script>
</body>

</html>
